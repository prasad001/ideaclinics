<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Is a doctor-led weight plan right for you? | IDEA Clinics</title>
<meta name="description" content="Answer a few quick questions and find out if you could benefit from a consultation with a registered doctor.">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf3ea;--card:#ffffff;--opt:#fff8f2;--line:#f0d9c8;--ink:#2a1d15;--mute:#7a6558;
  --teal:#f1793d;--blue:#15a95d;--grad:linear-gradient(90deg,#15a95d,#1bbf6a);--warn:#d93a3a;--violet:#f1793d
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:linear-gradient(180deg,#e96b43 0,#f79a4a 230px,var(--bg) 230px);color:var(--ink);min-height:100vh;padding:0 16px 40px;line-height:1.45}
.progress{position:fixed;top:0;left:0;right:0;height:4px;background:transparent;z-index:9}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f1793d,#15a95d);transition:width .45s ease}
.wrap{max-width:460px;margin:0 auto;padding-top:0}
.brand{background:#fff;display:flex;justify-content:center;align-items:center;padding:8px 16px;margin:0 -16px 18px;box-shadow:0 2px 10px #0002;position:sticky;top:0;z-index:5}
.brand img{height:64px;width:auto;display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 10px 30px #7a3a1a26}
.view{animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.015em;margin-bottom:10px}
h2{font-size:22px;line-height:1.25;font-weight:800;margin-bottom:8px}
.sub{color:var(--mute);font-size:14.5px;margin-bottom:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 22px}
.chip{background:var(--opt);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;color:#5b4636}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--opt);border:1.5px solid var(--line);color:var(--ink);font:inherit;font-size:15.5px;font-weight:500;padding:14px;border-radius:13px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:#f4a577}
.opt .ic{font-size:19px;width:26px;text-align:center;flex:none}
.opt.sel{border-color:var(--teal);background:#ffeadb}
.btn{display:block;width:100%;border:0;border-radius:13px;padding:15px;font:inherit;font-weight:700;font-size:16px;color:#fff;background:var(--grad);cursor:pointer;margin-top:20px;box-shadow:0 4px 0 #0e7d43;transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.back{background:none;border:0;color:var(--mute);font:inherit;font-size:14px;margin-top:16px;cursor:pointer;padding:4px 0}
.back:hover{color:var(--ink)}
.legal{color:#8a7566;font-size:11.5px;text-align:center;margin:18px 6px 0;line-height:1.5}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}

/* sliders */
.srow{margin-bottom:18px}
.slab{display:flex;justify-content:space-between;font-size:14px;color:var(--mute);margin-bottom:8px}
.slab b{color:var(--ink);font-size:15px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--teal) var(--p,50%),#f0d9c8 var(--p,50%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px #0004;cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:0;cursor:pointer}
.bmi{background:var(--opt);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
.bmi small{color:var(--mute);font-size:12px}
.bmi .n{font-size:38px;font-weight:800;line-height:1.1}
.bmi .cat{font-size:13px;font-weight:700}
.gauge{position:relative;height:8px;border-radius:9px;margin:14px 4px 6px;background:linear-gradient(90deg,#4aa3ff 0 12%,#2ed8a3 12% 40%,#ffc857 40% 58%,#ff6b6b 58%)}
.gauge i{position:absolute;top:-5px;width:4px;height:18px;background:#fff;border-radius:3px;transform:translateX(-50%);transition:left .2s}
.gl{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);padding:0 2px}
.tip{font-size:12.5px;color:var(--mute);margin-top:12px;text-align:left}

/* form */
label{display:block;font-size:13.5px;color:var(--mute);margin:14px 0 6px}
.in{width:100%;background:var(--opt);border:1.5px solid var(--line);border-radius:12px;color:var(--ink);font:inherit;font-size:16px;padding:13px 14px}
.in:focus{border-color:var(--teal);outline:0}
.phone{display:flex;gap:8px}.phone .cc{width:64px;text-align:center;flex:none}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#6b5648;margin-top:14px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--teal);width:18px;height:18px;flex:none}
.chk a{color:#d9581f}
.err{color:var(--warn);font-size:13.5px;min-height:20px;margin-top:10px}

/* result */
.badge{display:inline-flex;gap:6px;align-items:center;background:#e6f6ec;color:#0e7d43;border:1px solid #a8dcbc;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:99px;margin-bottom:14px}
.insight{background:#fff0e6;border-left:3px solid var(--teal);border-radius:10px;padding:14px;margin:16px 0;font-size:14.5px}
.insight b{display:block;margin-bottom:4px}
.steps{list-style:none;margin-top:10px}
.steps li{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;margin:10px 0}
.steps span{flex:none;width:24px;height:24px;border-radius:50%;background:var(--opt);border:1px solid var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.note{background:#fff6dd;border:1px solid #f0d98a;color:#7a5d00;border-radius:10px;padding:12px;font-size:13.5px;margin-top:14px}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<div class="progress"><i id="bar"></i></div>
<header class="brand" id="brand"></header>
<div class="wrap">
  <div class="card view" id="stage"></div>
  <p class="legal">This check is for information only and is not a diagnosis or a prescription. Any treatment, including medication, is decided only by a registered medical practitioner after a consultation. Individual results vary.</p>
</div>

const WEB3FORMS_KEY = "YOUR_ACCESS_KEY_HERE";
/* ============================================== */

document.getElementById('brand').innerHTML = `<img src="${LOGO_SRC}" alt="${CLINIC}">`;
const stage = document.getElementById('stage'), bar = document.getElementById('bar');
const A = { hardest:null, change:null, height:165, weight:78, conditions:[], safety:[], start:null, gender:null };
const history = [];
const TOTAL = 8; // progress steps before the form

function paint(html, step){
  stage.classList.remove('view'); void stage.offsetWidth; stage.classList.add('view');
  stage.innerHTML = html;
  bar.style.width = (step/(TOTAL+1)*100)+'%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(fn){ history.push(fn); fn(); }
function back(){ history.pop(); const p = history[history.length-1]; p && p(); }
const backBtn = () => history.length>1 ? '<button class="back" id="back">← Back</button>' : '';
function wireBack(){ const b=document.getElementById('back'); if(b) b.onclick=back; }

/* ---------- generic single / multi question ---------- */
function question({title, sub, key, opts, multi, step, next, exclusive}){
  const cur = A[key];
  const isSel = o => multi ? cur.includes(o[1]) : cur===o[1];
  paint(`<h2>${title}</h2><p class="sub">${sub||''}</p>
    <div class="opts">${opts.map((o,i)=>`<button class="opt ${isSel(o)?'sel':''}" data-i="${i}"><span class="ic">${o[0]}</span>${o[1]}</button>`).join('')}</div>
    ${multi?`<button class="btn" id="cont" ${cur.length?'':'disabled'}>Continue</button>`:''}${backBtn()}`, step);
  const cont = document.getElementById('cont');
  stage.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const val = opts[b.dataset.i][1];
    if(!multi){ A[key]=val; b.classList.add('sel'); setTimeout(()=>go(next),220); return; }
    const isNone = exclusive && val===exclusive;
    if(isNone) A[key] = A[key].includes(val) ? [] : [val];
    else { A[key] = A[key].filter(x=>x!==exclusive); A[key] = A[key].includes(val) ? A[key].filter(x=>x!==val) : [...A[key], val]; }
    stage.querySelectorAll('.opt').forEach((x,i)=>x.classList.toggle('sel', A[key].includes(opts[i][1])));
    cont.disabled = !A[key].length;
  });
  if(cont) cont.onclick = () => go(next);
  wireBack();
}

/* ---------- screens ---------- */
function sIntro(){
  paint(`<h1>Is a doctor-led weight plan right for you?</h1>
    <p class="sub">Answer a few quick questions and find out if you could benefit from a consultation with a registered doctor. Built for Indian bodies, using Asian BMI cut-offs.</p>
    <div class="chips"><span class="chip">⏱️ 60 seconds</span><span class="chip">🔒 Private</span><span class="chip">🩺 Doctor-led</span><span class="chip">🇮🇳 Made for India</span></div>
    <button class="btn" id="start" style="margin-top:0">Start my check →</button>`, 0);
  document.getElementById('start').onclick = () => go(sHardest);
}
const sHardest = () => question({title:"What's the hardest part about managing your weight?", sub:"Be honest — most people relate to more than one of these.", key:'hardest', step:1, next:sChange,
  opts:[['🍫','Cravings and late-night hunger'],['⏳','No time with work and family'],['📉','Weight comes back after I lose it'],['🧑‍🎤','Staying motivated']]});
const sChange = () => question({title:"What would you most like to change?", sub:"Pick the one that matters most right now.", key:'change', step:2, next:sBMI,
  opts:[['⚖️','Lose weight and keep it off'],['🩸','Better blood sugar control'],['⚡','More energy, less tiredness'],['🎯','Honestly, all of the above']]});

function bmiInfo(h,w){
  const b = w/((h/100)**2);
  const cat = b<18.5?['Lower range','#4aa3ff']:b<23?['Healthy range','#2ed8a3']:b<25?['Slightly higher','#ffc857']:['Higher range','#ff6b6b'];
  return {b, label:cat[0], color:cat[1]};
}
function sBMI(){
  paint(`<h2>Let's check your BMI 📏</h2><p class="sub">Slide to set your height and weight.</p>
    <div class="srow"><div class="slab"><span>Height</span><b id="hv"></b></div><input type="range" id="h" min="130" max="200" value="${A.height}" aria-label="Height in centimetres"></div>
    <div class="srow"><div class="slab"><span>Weight</span><b id="wv"></b></div><input type="range" id="w" min="35" max="160" value="${A.weight}" aria-label="Weight in kilograms"></div>
    <div class="bmi"><small>Your BMI</small><div class="n" id="bn"></div><div class="cat" id="bc"></div>
      <div class="gauge"><i id="gp"></i></div><div class="gl"><span>18.5</span><span>23</span><span>25</span><span>35+</span></div>
      <p class="tip">💡 Did you know? Indians tend to carry more body fat at a lower weight, so doctors in India use lower BMI cut-offs (23 and 25) than Western charts.</p></div>
    <button class="btn" id="cont">Continue</button>${backBtn()}`, 3);
  const h=document.getElementById('h'), w=document.getElementById('w');
  const upd=()=>{
    A.height=+h.value; A.weight=+w.value;
    [h,w].forEach(r=>r.style.setProperty('--p',((r.value-r.min)/(r.max-r.min)*100)+'%'));
    document.getElementById('hv').textContent=A.height+' cm'; document.getElementById('wv').textContent=A.weight+' kg';
    const i=bmiInfo(A.height,A.weight);
    document.getElementById('bn').textContent=i.b.toFixed(1);
    const c=document.getElementById('bc'); c.textContent=i.label; c.style.color=i.color;
    document.getElementById('gp').style.left=Math.min(98,Math.max(2,(i.b-15)/(35-15)*100))+'%';
  };
  h.oninput=w.oninput=upd; upd();
  document.getElementById('cont').onclick=()=>go(sConditions);
  wireBack();
}
const sConditions = () => question({title:"Do any of these apply to you?", sub:"Select all that apply. Many Indians have these without knowing, and they matter for your plan.", key:'conditions', multi:true, exclusive:'None of these', step:4, next:sSafety,
  opts:[['🩸','Type 2 diabetes or pre-diabetes'],['💗','High blood pressure'],['💉','High cholesterol'],['🫁','Fatty liver'],['🌸','PCOS / PCOD'],['😴','Snoring or sleep apnea'],['✅','None of these']]});
const sSafety = () => question({title:"Quick safety check 🛡️", sub:"This helps the doctor keep you safe. Your answers stay private.", key:'safety', multi:true, exclusive:'None of these', step:5, next:sStart,
  opts:[['🤰','Pregnant, planning pregnancy, or breastfeeding (if applicable)'],['🫃','Past pancreatitis'],['🦋','Personal or family history of thyroid cancer'],['💉','Type 1 diabetes'],['🍽️','Current or past eating disorder'],['💊','Taking insulin or other diabetes medicines'],['✅','None of these']]});
const sStart = () => question({title:"When would you like to start?", key:'start', step:6, next:sGender,
  opts:[['🚀','This week'],['📅','Within this month'],['🔎','Just exploring for now']]});
const sGender = () => question({title:"And your gender?", sub:"Helps the doctor personalise advice.", key:'gender', step:7, next:sForm,
  opts:[['♀️','Female'],['♂️','Male'],['🌈','Other'],['🙊','Prefer not to say']]});

function sForm(){
  paint(`<h2>Your result is ready! 🎉</h2><p class="sub">Where should we send it? Our care team will also share next steps on WhatsApp.</p>
    <form id="f" novalidate>
      <label for="nm">Full name</label><input class="in" id="nm" autocomplete="name">
      <label for="ph">WhatsApp number</label><div class="phone"><input class="in cc" value="+91" readonly aria-label="Country code"><input class="in" id="ph" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" autocomplete="tel-national"></div>
      <label for="ct">City</label><input class="in" id="ct" placeholder="e.g. Pune" autocomplete="address-level2">
      <label class="chk"><input type="checkbox" id="c1"><span>I confirm I am 18 or older, and I agree that ${CLINIC} and its registered doctors may contact me by call or WhatsApp about this enquiry. My answers will be used only to assess my consultation, as per the <a href="${PRIVACY_URL}">Privacy Policy</a>. I can withdraw consent anytime.</span></label>
      <label class="chk"><input type="checkbox" id="c2"><span>(Optional) Send me health tips and offers.</span></label>
      <input type="text" id="hp" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="sub" style="margin-top:6px">See my result →</button>
    </form>${backBtn()}`, TOTAL);
  document.getElementById('ph').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
  document.getElementById('f').onsubmit=submit;
  wireBack();
}

async function submit(e){
  e.preventDefault();
  const g=id=>document.getElementById(id), err=g('err'), btn=g('sub');
  const name=g('nm').value.trim(), phone=g('ph').value.trim(), city=g('ct').value.trim();
  if(name.length<2) return err.textContent='Enter your full name.';
  if(!/^[6-9]\d{9}$/.test(phone)) return err.textContent='Enter a valid 10-digit mobile number.';
  if(city.length<2) return err.textContent='Enter your city.';
  if(!g('c1').checked) return err.textContent='Please tick the consent box to continue.';
  if(g('hp').value) return;
  err.textContent=''; btn.disabled=true; btn.textContent='Preparing your result…';
  const i=bmiInfo(A.height,A.weight);
  const lead={name,whatsapp:'+91'+phone,city,marketing_opt_in:g('c2').checked?'Yes':'No',
    biggest_challenge:A.hardest,goal:A.change,height_cm:A.height,weight_kg:A.weight,bmi:i.b.toFixed(1),bmi_range:i.label,
    conditions:A.conditions.join(', '),safety_flags:A.safety.join(', '),start_timeline:A.start,gender:A.gender};
  console.log('Lead payload:', lead);
  if(WEB3FORMS_KEY && WEB3FORMS_KEY!=='YOUR_ACCESS_KEY_HERE'){
    try{
      const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
        body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'New lead: '+name+' ('+city+')',from_name:CLINIC+' quiz',...lead})});
      const d=await r.json(); if(!d.success) throw new Error(d.message);
    }catch(x){ err.textContent='We could not send your details. Check your connection and try again.'; btn.disabled=false; btn.textContent='See my result →'; return; }
  }
  history.length=0; sResult(name,i);
}

const INSIGHTS = {
  'Cravings and late-night hunger':['About cravings and late-night hunger','Strong hunger signals are driven by hormones, not weak willpower. A doctor can look at what is behind them.'],
  'No time with work and family':['About having no time','A good plan fits into a busy day. Consultations are short and can be done from home.'],
  'Weight comes back after I lose it':['About weight coming back after I lose it','Weight regain is a known biological response, not your failure. A doctor-led plan focuses on keeping it off, not just losing it.'],
  'Staying motivated':['About staying motivated','Motivation rises and falls for everyone. Regular check-ins with a care team make it easier to keep going.']
};
function sResult(name,i){
  const first=name.split(' ')[0];
  const fit = i.b>=23 || (A.conditions.length && !A.conditions.includes('None of these'));
  const flagged = A.safety.length && !A.safety.includes('None of these');
  const ins = INSIGHTS[A.hardest] || INSIGHTS['Staying motivated'];
  paint(`<span class="badge">${fit?'✅ Likely a good fit':'💬 A chat may still help'}</span>
    <h2 id="rt"></h2>
    <p class="sub">Based on your answers, a registered doctor may be able to discuss medical weight management options with you, along with nutrition and lifestyle support. Only the doctor can decide what is right for you.</p>
    <p style="font-size:14.5px">Your BMI: <b style="color:${i.color}">${i.b.toFixed(1)} · ${i.label}</b></p>
    <div class="insight"><b>${ins[0]}</b>${ins[1]}</div>
    ${flagged?'<div class="note">You mentioned something on the safety check. That is useful, and the doctor will review it carefully before suggesting anything.</div>':''}
    <h2 style="font-size:17px;margin-top:20px">What happens next</h2>
    <ul class="steps"><li><span>1</span>Our care team will WhatsApp you within 24 hours.</li><li><span>2</span>You choose a time for a short call with a registered doctor.</li><li><span>3</span>The doctor reviews your history and explains your options.</li></ul>`, TOTAL+1);
  document.getElementById('rt').textContent = first+', you may benefit from a doctor consultation';
}

go(sIntro);
</script>
</body>
</html>
